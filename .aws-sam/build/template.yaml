AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'YouTube SAM deployment

  '
Parameters:
  Route53DomainName:
    Type: String
    Default: digital-innovation-services.com
    AllowedValues:
    - digital-innovation-services.com
  AwsAccountNumber:
    Type: String
    Default: 261461557941
    AllowedValues:
    - 261461557941
  HostedZoneIDName:
    Type: String
    Default: Z0839489Y5F6C2EYO3IK
    AllowedValues:
    - Z0839489Y5F6C2EYO3IK
  ReactBucketName:
    Type: String
    Default: example-bucket-12345665874
    AllowedValues:
    - example-bucket-12345665874
  CloudFrontCertUsEast1:
    Type: String
    Default: e2b6a807-3570-4c75-acdb-42d1c452afb3
    AllowedValues:
    - e2b6a807-3570-4c75-acdb-42d1c452afb3
Resources:
  S3Stack:
    Type: AWS::Serverless::Application
    Properties:
      Location: S3Stack/template.yaml
      Parameters:
        ReactBucketName:
          Ref: ReactBucketName
        AwsAccountNumber:
          Ref: AwsAccountNumber
        ReactCloudFrontDistribution:
          Fn::GetAtt:
          - CloudfrontStack
          - Outputs.CloudfrontDistributionID
    Metadata:
      SamResourceId: S3Stack
  CloudfrontStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: CloudfrontStack/template.yaml
      Parameters:
        AwsAccountNumber:
          Ref: AwsAccountNumber
        ReactBucketName:
          Ref: ReactBucketName
        Route53DomainName:
          Ref: Route53DomainName
        HostedZoneIDName:
          Ref: HostedZoneIDName
        CloudFrontCertUsEast1:
          Ref: CloudFrontCertUsEast1
    Metadata:
      SamResourceId: CloudfrontStack
Outputs:
  CloudFrontID:
    Description: Cloudfront Distribution ID
    Value:
      Fn::GetAtt:
      - CloudfrontStack
      - Outputs.CloudfrontDistributionID
