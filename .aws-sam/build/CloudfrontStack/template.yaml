AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Cloudfront Infrastructure Stack

  '
Parameters:
  CloudfrontHostedZoneID:
    Type: String
    Default: Z2FDTNDATAQYW2
  IndexDocument:
    Type: String
    Description: Index document
    Default: index.html
  ErrorDocument:
    Type: String
    Description: The error document, ignored in SPA mode
    Default: 404.html
  ReactBucketName:
    Type: String
  Route53DomainName:
    Type: String
  HostedZoneIDName:
    Type: String
  CloudFrontCertUsEast1:
    Type: String
  AwsAccountNumber:
    Type: String
Resources:
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        OriginAccessControlOriginType: s3
        Name: react-S3-bucket-oac
        SigningBehavior: always
        SigningProtocol: sigv4
  ReactCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Ref: AWS::StackName
        DefaultRootObject:
          Ref: IndexDocument
        HttpVersion: http2
        CustomErrorResponses:
        - ErrorCachingMinTTL: 10
          ErrorCode: 403
          ResponseCode: 200
          ResponsePagePath:
            Fn::Sub: /${IndexDocument}
        - ErrorCachingMinTTL: 10
          ErrorCode: 404
          ResponseCode: 200
          ResponsePagePath:
            Fn::Sub: /${IndexDocument}
        Origins:
        - DomainName:
            Fn::Sub: ${ReactBucketName}.s3.${AWS::Region}.amazonaws.com
          Id: bucketOrigin
          OriginAccessControlId:
            Ref: OriginAccessControl
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          TargetOriginId: bucketOrigin
          ViewerProtocolPolicy: redirect-to-https
        PriceClass: PriceClass_All
        Aliases:
        - Fn::Sub: ${Route53DomainName}
        ViewerCertificate:
          AcmCertificateArn:
            Fn::Sub: arn:aws:acm:us-east-1:${AwsAccountNumber}:certificate/${CloudFrontCertUsEast1}
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
  Route53ToCloudfront:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Fn::Sub: ${HostedZoneIDName}
      Name:
        Fn::Sub: ${Route53DomainName}
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - ReactCloudFrontDistribution
          - DomainName
        HostedZoneId:
          Ref: CloudfrontHostedZoneID
Outputs:
  CloudfrontDistributionID:
    Value:
      Ref: ReactCloudFrontDistribution
